<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abhinav | Stopwatch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4b0082, #7b2cbf);
        }

        .stopwatch {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #4b0082;
            margin-bottom: 10px;
        }

        .name {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        #display {
            font-size: 55px;
            font-weight: bold;
            color: #222;
            margin: 25px 0;
            font-family: monospace;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #4b0082;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #222;
            transform: translateY(-2px);
        }

        .laps {
            margin-top: 30px;
            text-align: left;
        }

        .laps h2 {
            color: #4b0082;
            font-size: 22px;
            margin-bottom: 10px;
        }

        #lapList {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        #lapList li {
            background: #f1eafa;
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 5px;
        }

        @media (max-width: 500px) {

            #display {
                font-size: 40px;
            }

            button {
                padding: 10px 16px;
                font-size: 14px;
            }

            .stopwatch {
                padding: 30px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="stopwatch">

        <h1>Stopwatch</h1>

        <div class="name">
