<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stopwatch Web Application</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4b0082, #8a2be2);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 450px;
    background: white;
    padding: 35px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
    color: #4b0082;
    font-size: 42px;
    margin-bottom: 25px;
}

#display {
    font-size: 45px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
    font-family: monospace;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #4b0082;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #7b2cbf;
}

#laps {
    margin-top: 25px;
    text-align: left;
}

.lap {
    background: #eee5f7;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
}

@media (max-width: 500px) {
    h1 {
        font-size: 36px;
    }

    #display {
        font-size: 35px;
    }

    button {
        padding: 10px 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <div class="buttons">
        <button onclick="startStopwatch()">Start</button>
        <button onclick="pauseStopwatch()">Pause</button>
        <button onclick="resetStopwatch()">Reset</button>
        <button onclick="lapStopwatch()">Lap</button>
    </div>

    <div id="laps"></div>

</div>

<script>

let seconds = 0;
let timer = null;

function showTime() {

    let hrs = Math.floor(seconds / 3600);
    let mins = Math.floor((seconds % 3600) / 60);
    let secs = seconds % 60;

    hrs = hrs < 10 ? "0" + hrs : hrs;
    mins = mins < 10 ? "0" + mins : mins;
    secs = secs < 10 ? "0" + secs : secs;

    document.getElementById("display").innerText =
        hrs + ":" + mins + ":" + secs;
}

function startStopwatch() {

    if (timer !== null) {
        return;
    }

    timer = setInterval(function() {
        seconds++;
        showTime();
    }, 1000);
}

function pauseStopwatch() {

    clearInterval(timer);
    timer = null;
}

function resetStopwatch() {

    clearInterval(timer);
    timer = null;

    seconds = 0;
    showTime();

    document.getElementById("laps").innerHTML = "";
}

function lapStopwatch() {

    if (timer === null) {
        return;
    }

    let lapTime = document.getElementById("display").innerText;

    let lap = document.createElement("div");
    lap.className = "lap";
    lap.innerText = "Lap: " + lapTime;

    document.getElementById("laps").appendChild(lap);
}

</script>

</body>
  </html>
