<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Stopwatch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #93c5fd;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
        }

        .display {
            font-size: 55px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 35px;
            font-family: monospace;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #start {
            background: #2563eb;
            color: white;
        }

        #pause {
            background: #f59e0b;
            color: white;
        }

        #reset {
            background: #ef4444;
            color: white;
        }

        #lap {
            background: #10b981;
            color: white;
        }

        button:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
